    <tspan x="22" dy="20"><tspan class="cyan">  │  </tspan>Панель — этот сервер · <tspan class="green">✓ remnawave-db</tspan></tspan>
    <tspan x="22" dy="20"><tspan class="cyan">  └</tspan><tspan class="gray">────────────────────────────────────</tspan></tspan>
    <tspan x="22" dy="20"> </tspan>
    <tspan x="22" dy="20"> 1. Полный бэкап   <tspan class="gray">(БД + файлы)</tspan>     [<tspan class="green">✓ Ежедневно 04:00</tspan>]</tspan>
