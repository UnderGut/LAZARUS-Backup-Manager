<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280">
  <style>
    .bg{fill:#1e1e1e}
    .text{font-family:Consolas,'Courier New',monospace;font-size:14px;fill:#ecf0f1;white-space:pre}
    .green{fill:#2ecc71;font-weight:bold}
    .cyan{fill:#3498db}
    .red{fill:#e74c3c}
    .yellow{fill:#f1c40f}
    .gray{fill:#7f8c8d}
    .magenta{fill:#9b59b6}
    .bold{font-weight:bold}
    .wh{fill:#2d2d2d} .dr{fill:#ff5f56} .dy{fill:#ffbd2e} .dg{fill:#27c93f}
  </style>
  <rect x="0" y="0" width="600" height="280" rx="10" ry="10" class="bg"/>
  <path d="M0 10 C0 4 4 0 10 0 L590 0 C596 0 600 4 600 10 L600 30 L0 30 Z" class="wh"/>
  <circle cx="20" cy="15" r="6" class="dr"/><circle cx="40" cy="15" r="6" class="dy"/><circle cx="60" cy="15" r="6" class="dg"/>
  <text x="22" y="52" class="text">
    <tspan x="22" dy="0"><tspan class="green">Восстановление из бэкапа</tspan></tspan>
    <tspan x="22" dy="20"><tspan class="gray">Цель: Remnawave Panel · этот сервер · контейнер БД remnawave-db</tspan></tspan>
    <tspan x="22" dy="20"><tspan class="yellow">Восстановление заменит текущие данные этой цели.</tspan></tspan>
    <tspan x="22" dy="20"> </tspan>
    <tspan x="22" dy="20"> 1. Полный бэкап        <tspan class="cyan">[12 шт]</tspan></tspan>
    <tspan x="22" dy="20"> 2. Только БД           <tspan class="cyan">[30 шт]</tspan></tspan>
    <tspan x="22" dy="20"> 3. Только файлы        <tspan class="gray">[0 шт]</tspan></tspan>
    <tspan x="22" dy="20"> 4. Инкрементальный     <tspan class="cyan">[8 шт]</tspan><tspan class="gray"> — последний полный + изменения</tspan></tspan>
    <tspan x="22" dy="20"> 0. Назад</tspan>
    <tspan x="22" dy="20"> </tspan>
    <tspan x="22" dy="20">Выбор (Enter — назад): <tspan class="green">_</tspan></tspan>
  </text>
</svg>
