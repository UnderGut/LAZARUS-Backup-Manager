    <tspan x="22" dy="20"> </tspan>
    <tspan x="22" dy="20"> 0. Назад</tspan>
    <tspan x="22" dy="20"> </tspan>
    <tspan x="22" dy="20">Выбор (Enter — назад): <tspan class="green">_</tspan></tspan>
