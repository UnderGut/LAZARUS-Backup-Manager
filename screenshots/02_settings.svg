<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440">
  <style>
    .bg{fill:#1e1e1e}
    .text{font-family:Consolas,'Courier New',monospace;font-size:14px;fill:#ecf0f1;white-space:pre}
    .green{fill:#2ecc71;font-weight:bold}
    .cyan{fill:#3498db}
    .red{fill:#e74c3c}
    .yellow{fill:#f1c40f}
    .gray{fill:#7f8c8d}
    .magenta{fill:#9b59b6}
    .bold{font-weight:bold}
    .wh{fill:#2d2d2d} .dr{fill:#ff5f56} .dy{fill:#ffbd2e} .dg{fill:#27c93f}
  </style>
  <rect x="0" y="0" width="600" height="440" rx="10" ry="10" class="bg"/>
  <path d="M0 10 C0 4 4 0 10 0 L590 0 C596 0 600 4 600 10 L600 30 L0 30 Z" class="wh"/>
  <circle cx="20" cy="15" r="6" class="dr"/><circle cx="40" cy="15" r="6" class="dy"/><circle cx="60" cy="15" r="6" class="dg"/>
  <text x="22" y="52" class="text">
    <tspan x="22" dy="0"><tspan class="green">Настройки</tspan></tspan>
    <tspan x="22" dy="20"><tspan class="gray">Бэкапим: </tspan><tspan class="cyan">Remnawave Panel + бот</tspan></tspan>
    <tspan x="22" dy="20"> </tspan>
    <tspan x="22" dy="20"><tspan class="gray">── Что бэкапим ────────────────────────────────</tspan></tspan>
    <tspan x="22" dy="20"> 1. Что бэкапим и пути    (контейнеры, исключения, лимит файла)</tspan>
    <tspan x="22" dy="20"> 7. Цель бэкапа           (панель / бот / обе · этот сервер или SSH)</tspan>
    <tspan x="22" dy="20"> 8. Доп. компоненты       (infra-billing · KB ИИ-саппорта)</tspan>
    <tspan x="22" dy="20"><tspan class="gray">── Куда доставляем ────────────────────────────</tspan></tspan>
    <tspan x="22" dy="20"> 2. Telegram              (токен, уведомления, проверка связи)</tspan>
    <tspan x="22" dy="20"> 3. Удалённое хранилище   (S3 / FTP / WebDAV / Rclone)</tspan>
    <tspan x="22" dy="20"><tspan class="gray">── Как храним ─────────────────────────────────</tspan></tspan>
    <tspan x="22" dy="20"> 4. Шифрование            (пароль AES-256)</tspan>
    <tspan x="22" dy="20"> 5. Ротация и диск        (сколько хранить, пороги)</tspan>
    <tspan x="22" dy="20"> 6. Компрессия и бэкап логов</tspan>
    <tspan x="22" dy="20"> </tspan>
    <tspan x="22" dy="20"> 0. Назад</tspan>
    <tspan x="22" dy="20"><tspan class="gray"> (переключение Простой/Расширенный режим — пункт 99 в главном меню)</tspan></tspan>
    <tspan x="22" dy="20"> </tspan>
    <tspan x="22" dy="20">Выбор раздела (Enter — назад): <tspan class="green">_</tspan></tspan>
  </text>
</svg>
