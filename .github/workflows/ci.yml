name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Bash syntax check
        run: bash -n lazarus-backup
      - name: Shellcheck (errors only)
        run: shellcheck -S error -x lazarus-backup

  tests:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: System info
        run: |
          bash --version | head -1
          openssl version
          which python3 timeout gzip find tr
          uname -a
      - name: Install test deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openssl coreutils python3 gzip zstd rsync
      # Прогоняем ВСЕ .github/tests/test_*.sh в цикле — новые тесты подхватываются
      # автоматически (раньше список был захардкожен по-степенно и отставал: часть тестов
      # в CI не запускалась). Каждый тест печатает своё имя; при падении — явный маркер и
      # список упавших в конце, exit 1.
      - name: Run all tests
        run: |
          shopt -s nullglob
          failed=()
          for t in .github/tests/test_*.sh; do
            echo "::group::${t}"
            if bash "$t"; then
              echo "PASS ${t}"
            else
              echo "::error::FAIL ${t}"
              failed+=("$t")
            fi
            echo "::endgroup::"
          done
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "Провалено: ${#failed[@]} — ${failed[*]}"
            exit 1
          fi
          echo "Все тесты зелёные."
