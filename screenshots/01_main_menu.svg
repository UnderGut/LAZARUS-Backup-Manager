<svg xmlns="http://www.w3.org/2000/svg" width="612" height="720" viewBox="0 0 612 720">
  <style>
    .bg{fill:#1e1e1e}
    .text{font-family:Consolas,'Courier New',monospace;font-size:14px;fill:#ecf0f1;white-space:pre}
    .green{fill:#2ecc71;font-weight:bold}
    .cyan{fill:#3498db}
    .red{fill:#e74c3c}
    .yellow{fill:#f1c40f}
    .gray{fill:#7f8c8d}
    .magenta{fill:#9b59b6}
    .bold{font-weight:bold}
    .wh{fill:#2d2d2d} .dr{fill:#ff5f56} .dy{fill:#ffbd2e} .dg{fill:#27c93f}
  </style>
  <rect x="0" y="0" width="612" height="720" rx="10" ry="10" class="bg"/>
  <path d="M0 10 C0 4 4 0 10 0 L602 0 C608 0 612 4 612 10 L612 30 L0 30 Z" class="wh"/>
  <circle cx="20" cy="15" r="6" class="dr"/><circle cx="40" cy="15" r="6" class="dy"/><circle cx="60" cy="15" r="6" class="dg"/>
  <text x="22" y="52" class="text">
    <tspan x="22" dy="0"><tspan class="green">╔═════════════════════════════════════════════════╗</tspan></tspan>
    <tspan x="22" dy="20"><tspan class="green">║  </tspan><tspan class="bold">LAZARUS</tspan><tspan class="gray"> · Менеджер бэкапов</tspan><tspan class="green">                     ║</tspan></tspan>
    <tspan x="22" dy="20"><tspan class="green">╚═════════════════════════════════════════════════╝</tspan></tspan>
    <tspan x="22" dy="20"><tspan class="cyan">  ┌─</tspan><tspan class="bold"> Что бэкапим</tspan></tspan>
    <tspan x="22" dy="20"><tspan class="cyan">  │  </tspan>Панель — этот сервер · <tspan class="green">✓ remnawave-db (запущен)</tspan></tspan>
    <tspan x="22" dy="20"><tspan class="cyan">  │  </tspan>Бот    — этот сервер · <tspan class="green">✓ rwp_shop_db (запущен)</tspan></tspan>
    <tspan x="22" dy="20"><tspan class="cyan">  │  </tspan><tspan class="gray">+ доп. путей: 2 — в full-бэкапе панели</tspan></tspan>
    <tspan x="22" dy="20"><tspan class="cyan">  └</tspan><tspan class="gray">────────────────────────────────────────────────</tspan></tspan>
    <tspan x="22" dy="20"><tspan class="bold">  Защита:</tspan>    <tspan class="green">✓ шифрование</tspan> · <tspan class="green">✓ копия в облаке (S3)</tspan> · <tspan class="green">✓ авто-бэкап</tspan></tspan>
    <tspan x="22" dy="20"> </tspan>
    <tspan x="22" dy="20"><tspan class="bold">  Бэкапы:</tspan>    панель 48 · бот 51 · всего 6.2G</tspan>
    <tspan x="22" dy="20"><tspan class="bold">  Последний:</tspan><tspan class="gray"> панель 04:00 (5 ч назад) · бот 04:00</tspan></tspan>
    <tspan x="22" dy="20"><tspan class="bold">  Авто:</tspan>      Full <tspan class="green">✓ Ежедневно 04:00</tspan> · DB <tspan class="green">✓ Каждые 30 мин</tspan> · Files <tspan class="gray">— выкл</tspan></tspan>
    <tspan x="22" dy="20"> </tspan>
    <tspan x="22" dy="20"><tspan class="gray">  ── Действия ─────────────────────────────────────</tspan></tspan>
    <tspan x="22" dy="20">    1.  Сделать бэкап сейчас</tspan>
    <tspan x="22" dy="20">    2.  Восстановить из бэкапа</tspan>
    <tspan x="22" dy="20"> </tspan>
    <tspan x="22" dy="20"><tspan class="gray">  ── Настройка ────────────────────────────────────</tspan></tspan>
    <tspan x="22" dy="20">    3.  Авто-бэкап (расписание)</tspan>
    <tspan x="22" dy="20">    4.  Настройки</tspan>
    <tspan x="22" dy="20"> </tspan>
    <tspan x="22" dy="20"><tspan class="gray">  ── Обслуживание ─────────────────────────────────</tspan></tspan>
    <tspan x="22" dy="20">    5.  Удалить старые бэкапы (&gt;7 дней)</tspan>
    <tspan x="22" dy="20">    6.  Обновления скрипта</tspan>
    <tspan x="22" dy="20">    7.  Перенести панель на другой сервер</tspan>
    <tspan x="22" dy="20"> </tspan>
    <tspan x="22" dy="20"><tspan class="gray">  ─────────────────────────────────────────────────</tspan></tspan>
    <tspan x="22" dy="20"><tspan class="cyan">   99.  Простой режим</tspan><tspan class="gray"> (короткое меню для новичков)</tspan></tspan>
    <tspan x="22" dy="20"><tspan class="red">  666.  Удалить скрипт</tspan></tspan>
    <tspan x="22" dy="20">    0.  Выход</tspan>
    <tspan x="22" dy="20"> </tspan>
    <tspan x="22" dy="20">  Выбор (Enter — выход из программы): <tspan class="green">_</tspan></tspan>
  </text>
</svg>
